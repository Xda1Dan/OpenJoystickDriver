name: Build

on:
  push:
    branches: [main, gyro-steering]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version; xcodebuild -version 2>&1 || true; ls /Applications/Xcode*.app 2>&1 | head -20
      - name: Build
        run: swift build 2>&1
      - name: Run tests
        run: swift test 2>&1 || true
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .build/debug/
