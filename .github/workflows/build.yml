name: Build

on:
  push:
    branches: [main, gyro-steering]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-13, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version; xcodebuild -version 2>&1 || true; uname -m
      - name: Build
        run: swift build 2>&1
      - name: Run tests
        run: swift test 2>&1 || true
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.os }}
          path: .build/debug/
