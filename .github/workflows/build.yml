name: Build

on:
  push:
    branches: [main, gyro-steering]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version; xcodebuild -version 2>&1 || true; uname -m
      - name: Build
        run: swift build -v 2>&1
      - name: Build Intel slice (x86_64)
        run: swift build --arch x86_64 -v 2>&1
      - name: Run tests
        run: swift test 2>&1 || true
      - name: Upload build artifact (ARM)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-arm64
          path: .build/debug/
      - name: Upload build artifact (Intel)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-intel
          path: .build/x86_64-apple-macosx/debug/
